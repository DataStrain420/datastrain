<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1d2428"/>
      <stop offset="100%" stop-color="#14181b"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#51ed92" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0ad6da" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bud1" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#4a8c5c"/>
      <stop offset="40%" stop-color="#2d6b3f"/>
      <stop offset="100%" stop-color="#1a4a2a"/>
    </radialGradient>
    <radialGradient id="bud2" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#5a9e6a"/>
      <stop offset="50%" stop-color="#387a48"/>
      <stop offset="100%" stop-color="#1f5530"/>
    </radialGradient>
    <radialGradient id="frost" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)" rx="16"/>
  <rect width="400" height="400" fill="url(#glow)" rx="16"/>

  <!-- Main bud cluster -->
  <g transform="translate(200, 195)" filter="url(#shadow)">
    <!-- Stem -->
    <path d="M0 70 Q-3 90 -2 120 Q0 130 2 120 Q3 90 0 70" fill="#3d6b2e"/>

    <!-- Small leaves -->
    <path d="M-2 95 Q-30 75 -45 90 Q-30 95 -2 100" fill="#2d6b3f" opacity="0.7"/>
    <path d="M2 95 Q30 75 45 90 Q30 95 2 100" fill="#2d6b3f" opacity="0.7"/>

    <!-- Lower calyxes -->
    <ellipse cx="-35" cy="30" rx="28" ry="35" fill="url(#bud1)" transform="rotate(-15 -35 30)"/>
    <ellipse cx="35" cy="30" rx="28" ry="35" fill="url(#bud1)" transform="rotate(15 35 30)"/>
    <ellipse cx="-20" cy="50" rx="25" ry="30" fill="url(#bud2)" transform="rotate(-8 -20 50)"/>
    <ellipse cx="20" cy="50" rx="25" ry="30" fill="url(#bud2)" transform="rotate(8 20 50)"/>

    <!-- Middle calyxes -->
    <ellipse cx="-25" cy="0" rx="30" ry="38" fill="url(#bud2)" transform="rotate(-10 -25 0)"/>
    <ellipse cx="25" cy="0" rx="30" ry="38" fill="url(#bud2)" transform="rotate(10 25 0)"/>
    <ellipse cx="0" cy="15" rx="28" ry="35" fill="url(#bud1)"/>

    <!-- Upper calyxes -->
    <ellipse cx="-15" cy="-25" rx="28" ry="32" fill="url(#bud2)" transform="rotate(-12 -15 -25)"/>
    <ellipse cx="15" cy="-25" rx="28" ry="32" fill="url(#bud2)" transform="rotate(12 15 -25)"/>
    <ellipse cx="0" cy="-15" rx="25" ry="33" fill="url(#bud1)"/>

    <!-- Top calyxes -->
    <ellipse cx="-8" cy="-50" rx="22" ry="28" fill="url(#bud2)" transform="rotate(-8 -8 -50)"/>
    <ellipse cx="8" cy="-50" rx="22" ry="28" fill="url(#bud1)" transform="rotate(8 8 -50)"/>
    <ellipse cx="0" cy="-55" rx="18" ry="25" fill="url(#bud2)"/>

    <!-- Orange pistils -->
    <g stroke="#d4792a" stroke-width="1.2" fill="none" opacity="0.8">
      <path d="M-10 -60 Q-18 -72 -12 -78"/>
      <path d="M8 -58 Q16 -70 10 -76"/>
      <path d="M-20 -30 Q-32 -40 -28 -48"/>
      <path d="M22 -28 Q34 -38 30 -46"/>
      <path d="M-30 5 Q-44 -2 -40 -12"/>
      <path d="M32 5 Q46 -2 42 -12"/>
      <path d="M-15 35 Q-28 28 -26 18"/>
      <path d="M18 35 Q30 28 28 18"/>
      <path d="M0 -70 Q-5 -82 2 -85"/>
      <path d="M-25 -45 Q-35 -55 -30 -60"/>
      <path d="M26 -45 Q36 -55 31 -60"/>
    </g>

    <!-- Trichome frost overlay -->
    <ellipse cx="0" cy="-20" rx="55" ry="70" fill="url(#frost)"/>

    <!-- Sparkle dots (trichomes) -->
    <g fill="#ffffff" opacity="0.3">
      <circle cx="-12" cy="-45" r="1.2"/>
      <circle cx="15" cy="-38" r="1"/>
      <circle cx="-28" cy="-15" r="1.1"/>
      <circle cx="30" cy="-8" r="1.3"/>
      <circle cx="-8" cy="10" r="1"/>
      <circle cx="18" cy="20" r="1.2"/>
      <circle cx="-22" cy="35" r="1"/>
      <circle cx="5" cy="-62" r="1.1"/>
      <circle cx="-18" cy="-55" r="0.9"/>
      <circle cx="22" cy="-52" r="1"/>
      <circle cx="0" cy="-30" r="1.3"/>
      <circle cx="-35" cy="10" r="0.8"/>
      <circle cx="35" cy="15" r="0.9"/>
    </g>
  </g>
</svg>
